<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f2ed" />
    <meta
      name="description"
      content="Explore the Garuda jersey collection in 3D. Slide the rail, turn every detail, and find your colors."
    />
    <title>GARUDA — Wear the spirit.</title>
    <style>
      .app-loading {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 18px;
        background: #f5f3ee;
        color: #282a26;
        font-family: Arial, 'Helvetica Neue', sans-serif;
      }
      .app-loading .wordmark {
        font-size: 28px;
        font-weight: 800;
        letter-spacing: -1.4px;
      }
      .app-loading-spinner {
        width: 38px;
        height: 38px;
        border: 3px solid #282a2626;
        border-top-color: #a8282d;
        border-radius: 50%;
        animation: app-loading-spin 0.8s linear infinite;
      }
      .app-loading p {
        margin: 0;
        color: #777;
        font-size: 12px;
      }
      @keyframes app-loading-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .app-loading-spinner {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-loading" role="status" aria-live="polite">
        <span class="wordmark">GARUDA®</span>
        <span class="app-loading-spinner" aria-hidden="true"></span>
        <p>Getting your colors ready…</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
